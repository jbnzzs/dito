{% extends "base.html" %}

{% block title %}Senha alterada — Dito!{% endblock %}
{% block page_title %}Trocar senha{% endblock %}

{% block content %}

<div class="card" style="max-width:480px;">
    <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
        <h5 class="mt-3 mb-2">Senha alterada com sucesso</h5>
        <p class="text-secondary mb-4" style="font-size:0.875rem;">
            Use a nova senha no próximo login.
        </p>
        <a href="{% url 'minha_conta' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Voltar
        </a>
    </div>
</div>

{% endblock %}
