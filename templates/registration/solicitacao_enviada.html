{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação enviada — Dito!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dito-theme.css' %}">
    <style>
        html, body { height: 100%; margin: 0; background: #FAFAFA; }
        .ok-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .ok-card {
            background: #FFFFFF;
            border: 0.5px solid #DAD6CD;
            border-radius: 12px;
            padding: 3rem 2.5rem;
            max-width: 460px;
            text-align: center;
        }
        .ok-card i.icone {
            font-size: 3rem;
            color: #2E7D5B;
            display: block;
            margin-bottom: 1rem;
        }
        .ok-card h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #1A1A1A;
            margin-bottom: 0.75rem;
        }
        .ok-card p {
            color: #6E6E6E;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.75rem;
        }
    </style>
</head>
<body>
<div class="ok-wrapper">
    <div class="ok-card">
        <i class="bi bi-check-circle-fill icone"></i>
        <h1>Solicitação enviada!</h1>
        <p>
            Seus dados foram registrados com sucesso. Um administrador do Dito!
            vai analisar sua solicitação e definir seu perfil de acesso.
            Você poderá entrar assim que for aprovado.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Voltar
        </a>
    </div>
</div>
</body>
</html>
