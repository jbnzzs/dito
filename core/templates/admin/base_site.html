{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* ============================================================
       Tema Dito! para o Django Admin
       Cobre modo claro, escuro (sistema) e escuro (botao de lua).
       ============================================================ */

    :root,
    html[data-theme="light"],
    html[data-theme="dark"] {
        --primary: #A62E38;
        --secondary: #590515;
        --accent: #BF7D2C;

        --link-fg: #A62E38;
        --link-hover-color: #590515;
        --link-selected-fg: #590515;

        --header-color: #F3DEE1;
        --header-branding-color: #FFFFFF;
        --header-bg: #590515;
        --header-link-color: #F3DEE1;

        --breadcrumbs-fg: #F8F3EE;
        --breadcrumbs-link-fg: #FFFFFF;
        --breadcrumbs-bg: #A62E38;

        --button-fg: #FFFFFF;
        --button-bg: #A62E38;
        --button-hover-bg: #590515;
        --default-button-bg: #590515;
        --default-button-hover-bg: #3d0310;

        --object-tools-fg: #FFFFFF;
        --object-tools-bg: #590515;
        --object-tools-hover-bg: #3d0310;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #A62E38;
            --secondary: #590515;
            --header-bg: #590515;
            --breadcrumbs-bg: #A62E38;
            --link-fg: #E08A92;
            --link-hover-color: #F3DEE1;
            --button-bg: #A62E38;
            --button-hover-bg: #7d2530;
        }
    }

    /* ---- Sobrescritas diretas (o dark mode do Django e teimoso) ---- */

    #header {
        background: #590515 !important;
        color: #F3DEE1 !important;
    }
    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited {
        color: #FFFFFF !important;
        font-weight: 800;
    }
    #user-tools a:link, #user-tools a:visited { color: #F3DEE1 !important; }
    #user-tools a:hover { color: #FFFFFF !important; }

    div.breadcrumbs {
        background: #A62E38 !important;
        color: #F8F3EE !important;
    }
    div.breadcrumbs a { color: #FFFFFF !important; }

    .module caption,
    .module h2,
    .inline-group h2 {
        background: #A62E38 !important;
        color: #FFFFFF !important;
    }

    .button, input[type=submit], input[type=button],
    .submit-row input, a.button {
        background: #A62E38 !important;
        color: #FFFFFF !important;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: #7d2530 !important;
    }
    .button.default, input[type=submit].default,
    .submit-row input.default {
        background: #590515 !important;
    }
    .button.default:hover, input[type=submit].default:hover {
        background: #3d0310 !important;
    }

    .object-tools a:link, .object-tools a:visited {
        background: #590515 !important;
        color: #FFFFFF !important;
    }
    .object-tools a:hover { background: #3d0310 !important; }

    a:link, a:visited { color: var(--link-fg); }
    a:hover { color: var(--link-hover-color); }

    .selected, tr.selected {
        background: #F3DEE1 !important;
    }

    .actions .button {
        background: #A62E38 !important;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">Dito! — Administração</a>
</h1>
{% endblock %}
