{% extends "admin/base_site.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* ============================================================
       Tema Dito! para o Django Admin
       Cobre modo claro, escuro (sistema) e escuro (botao de lua).
       ============================================================ */

    :root,
    html[data-theme="light"],
    html[data-theme="dark"] {
        --primary: #1B3A5C;
        --secondary: #16304D;
        --accent: #B8860B;

        --link-fg: #1B3A5C;
        --link-hover-color: #16304D;
        --link-selected-fg: #16304D;

        --header-color: #B8C6D6;
        --header-branding-color: #FFFFFF;
        --header-bg: #16304D;
        --header-link-color: #B8C6D6;

        --breadcrumbs-fg: #FAFAFA;
        --breadcrumbs-link-fg: #FFFFFF;
        --breadcrumbs-bg: #1B3A5C;

        --button-fg: #FFFFFF;
        --button-bg: #1B3A5C;
        --button-hover-bg: #16304D;
        --default-button-bg: #16304D;
        --default-button-hover-bg: #3d0310;

        --object-tools-fg: #FFFFFF;
        --object-tools-bg: #16304D;
        --object-tools-hover-bg: #3d0310;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #1B3A5C;
            --secondary: #16304D;
            --header-bg: #16304D;
            --breadcrumbs-bg: #1B3A5C;
            --link-fg: #E08A92;
            --link-hover-color: #B8C6D6;
            --button-bg: #1B3A5C;
            --button-hover-bg: #7d2530;
        }
    }

    /* ---- Sobrescritas diretas (o dark mode do Django e teimoso) ---- */

    #header {
        background: #16304D !important;
        color: #B8C6D6 !important;
    }
    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited {
        color: #FFFFFF !important;
        font-weight: 800;
    }
    #user-tools a:link, #user-tools a:visited { color: #B8C6D6 !important; }
    #user-tools a:hover { color: #FFFFFF !important; }

    div.breadcrumbs {
        background: #1B3A5C !important;
        color: #FAFAFA !important;
    }
    div.breadcrumbs a { color: #FFFFFF !important; }

    .module caption,
    .module h2,
    .inline-group h2 {
        background: #1B3A5C !important;
        color: #FFFFFF !important;
    }

    .button, input[type=submit], input[type=button],
    .submit-row input, a.button {
        background: #1B3A5C !important;
        color: #FFFFFF !important;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: #7d2530 !important;
    }
    .button.default, input[type=submit].default,
    .submit-row input.default {
        background: #16304D !important;
    }
    .button.default:hover, input[type=submit].default:hover {
        background: #3d0310 !important;
    }

    .object-tools a:link, .object-tools a:visited {
        background: #16304D !important;
        color: #FFFFFF !important;
    }
    .object-tools a:hover { background: #3d0310 !important; }

    a:link, a:visited { color: var(--link-fg); }
    a:hover { color: var(--link-hover-color); }

    .selected, tr.selected {
        background: #FBF3DF !important;
    }

    .actions .button {
        background: #1B3A5C !important;
    }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">Dito! — Administração</a>
</h1>
{% endblock %}
